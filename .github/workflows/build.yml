name: Build Hackerini Client
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Pobieranie kodu z Twojego repozytorium
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Ustawienie Javy 21 (wymagana dla Minecraft 1.21.4)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Nadanie uprawnień do skryptu budującego
      - name: Grant Execute Permissions
        run: chmod +x gradlew

      # 4. Kompilacja moda (budowanie pliku .jar)
      - name: Build Mod with Gradle
        run: ./gradlew build

      # 5. Wysłanie gotowego pliku .jar do sekcji Artifacts
      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: Hackerini-Client-1.21.4
          path: build/libs/*.jar